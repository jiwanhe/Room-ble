<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoomFun 接收端</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#faf7f2; --surface:#fff; --ink:#1c1a17; --muted:#6f685d; --line:#e4ddd0;
    --vibe:#3a7ca5; --estim:#c25a3a; --stop:#b4342a; --ok:#2f7d4f; --warn:#b5860b;
    --radius:14px; --pt:env(safe-area-inset-top,0px); --pb:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#17150f; --surface:#211e18; --ink:#efe9dd; --muted:#9a9183; --line:#342f26;
    --vibe:#6fb0d4; --estim:#e08763; --stop:#e2564a; --ok:#62b583; --warn:#d9ad4a;
  }}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Helvetica Neue","PingFang TC",sans-serif;
    padding:calc(16px + var(--pt)) 16px calc(16px + var(--pb));
    max-width:560px;margin:0 auto;-webkit-text-size-adjust:100%;}
  body::before{content:"";position:fixed;inset:0 0 auto;height:var(--pt);background:var(--bg);z-index:11}
  h1{font-size:19px;font-weight:650;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  label.field{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
  input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:12px}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  button{font:inherit;border:none;border-radius:10px;padding:12px 16px;font-weight:600;
    cursor:pointer;color:#fff;background:var(--vibe);-webkit-appearance:none;width:100%}
  button:active{filter:brightness(.92)}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  button.stop{background:var(--stop);font-size:16px;letter-spacing:.03em}
  .status{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.6}
  .status b{color:var(--ink)} .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--muted);margin-right:6px;vertical-align:1px} .dot.on{background:var(--ok)}
  .live{display:flex;gap:18px;margin-top:4px}
  .live div{flex:1}
  .live .k{font-size:12px;color:var(--muted)}
  .live .n{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
  .live .vibe{color:var(--vibe)} .live .estim{color:var(--estim)}
  .lock{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin:2px 0 12px}
  .warn{color:var(--warn);font-size:12.5px;margin-top:6px}
  .log{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:10px;
    max-height:88px;overflow-y:auto;line-height:1.6}
  .big-stop{position:sticky;bottom:calc(var(--pb));margin-top:14px}
</style>
</head>
<body>
<h1>RoomFun 接收端</h1>
<p class="sub">擺在玩具旁、用 Bluefy 開著。它會自動聽中繼站的指令。</p>

<div class="card" id="setup">
  <label class="field">中繼站網址</label>
  <input type="text" id="relay" placeholder="https://roomfun-relay.rinazusa.workers.dev" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label class="field">通關密語</label>
  <input type="text" id="secret" placeholder="跟中繼站設的同一串" autocapitalize="off" autocorrect="off" spellcheck="false">

  <div class="row">
    <div>
      <label class="field">電流上限</label>
      <input type="number" id="cap" value="30" min="1" max="100">
    </div>
    <div>
      <label class="field">電流每秒最多 +</label>
      <input type="number" id="rate" value="10" min="1" max="100">
    </div>
  </div>

  <div class="lock">
    <input type="checkbox" id="estimLock">
    <label for="estimLock">允許微電流（不勾則電流一律為 0）</label>
  </div>
  <div class="warn">電流請從小開始。瞬間跳高會痛，也可能傷到。</div>
</div>

<div class="card">
  <button id="start">開始接收</button>
  <button id="stop" class="ghost" style="margin-top:8px" disabled>停止接收</button>
  <div class="status"><span class="dot" id="dot"></span><span id="status">尚未連線</span></div>
  <div class="live">
    <div><div class="k">震動</div><div class="n vibe" id="nVibe">0</div></div>
    <div><div class="k">微電流</div><div class="n estim" id="nEstim">0</div></div>
  </div>
  <div class="log" id="log"></div>
</div>

<button class="stop big-stop" id="hardstop">強制停止</button>

<script>
"use strict";
(function(){
  // ---- 協定 ----
  const SERVICE=0x9000, WRITE_CH=0x9002, NOTIFY_CH=0x9001;
  const HDR=[0xA0,0x98,0x02], END=[0xA2,0x80];
  const uuid=n=>`0000${n.toString(16).padStart(4,'0')}-0000-1000-8000-00805f9b34fb`;
  const POLL_MS=300;            // 每 0.3 秒問一次中繼站
  const TIMEOUT_MS=60000;       // 中繼站 60 秒沒更新就歸零

  // ---- 狀態 ----
  let device=null,server=null,writeChar=null,running=false;
  let vibe=0, estim=0, estimTarget=0;
  let pollTimer=null, rampTimer=null;
  let cfg={relay:'',secret:'',cap:30,rate:10,estimOK:false};

  const $=id=>document.getElementById(id);
  const el={relay:$('relay'),secret:$('secret'),cap:$('cap'),rate:$('rate'),
    estimLock:$('estimLock'),start:$('start'),stop:$('stop'),hardstop:$('hardstop'),
    status:$('status'),dot:$('dot'),nVibe:$('nVibe'),nEstim:$('nEstim'),log:$('log')};

  function log(m){const t=new Date().toLocaleTimeString('zh-Hant',{hour12:false});
    el.log.insertAdjacentHTML('afterbegin',`${t}　${m}<br>`);}
  function setStatus(t,on){el.status.innerHTML=t;el.dot.classList.toggle('on',!!on);}
  function showNums(){el.nVibe.textContent=vibe;el.nEstim.textContent=estim;}

  // 記住上次填的設定
  function save(){try{localStorage.setItem('rf_cfg',JSON.stringify(cfg));}catch(_){}}
  function load(){try{const s=JSON.parse(localStorage.getItem('rf_cfg')||'{}');
    if(s.relay)el.relay.value=s.relay; if(s.secret)el.secret.value=s.secret;
    if(s.cap)el.cap.value=s.cap; if(s.rate)el.rate.value=s.rate;
    if(s.estimOK)el.estimLock.checked=true;}catch(_){}}

  // ---- 藍牙寫入 ----
  async function writeRaw(b){ if(!writeChar)return false;
    try{await writeChar.writeValueWithoutResponse(new Uint8Array(b));return true;}
    catch(e){log('送出失敗：'+e.message);return false;}}
  async function pushState(){ await writeRaw([...HDR, vibe&0xff, estim&0xff]); }

  async function hardStop(reason){
    estimTarget=0; vibe=0; estim=0; showNums();
    if(rampTimer){clearInterval(rampTimer);rampTimer=null;}
    await writeRaw([...HDR,0,0]);
    if(reason)log('停止：'+reason);
  }

  // 電流爬升限速
  function stepEstim(){
    if(rampTimer)return;
    rampTimer=setInterval(async()=>{
      const step=Math.max(1,Math.round(cfg.rate/10)); // 每100ms一tick
      if(estim<estimTarget) estim=Math.min(estimTarget,estim+step);
      else if(estim>estimTarget) estim=estimTarget;   // 下降即時
      else{clearInterval(rampTimer);rampTimer=null;}
      showNums(); await pushState();
    },100);
  }

  // ---- 連藍牙 ----
  async function connectBLE(){
    if(!navigator.bluetooth){setStatus('這個瀏覽器不支援藍牙，請用 <b>Bluefy</b> 開。');return false;}
    setStatus('請在彈窗選擇 RoomFun…');
    device=await navigator.bluetooth.requestDevice({
      filters:[{name:'RoomFun'}], optionalServices:[uuid(SERVICE)]});
    device.addEventListener('gattserverdisconnected',onDisconnect);
    server=await device.gatt.connect();
    const svc=await server.getPrimaryService(uuid(SERVICE));
    writeChar=await svc.getCharacteristic(uuid(WRITE_CH));
    try{const n=await svc.getCharacteristic(uuid(NOTIFY_CH));
      await n.startNotifications().catch(()=>{});}catch(_){}
    log('藍牙已連線'); return true;
  }
  function onDisconnect(){
    writeChar=null;server=null;
    if(rampTimer){clearInterval(rampTimer);rampTimer=null;}
    setStatus('藍牙中斷，正在重連…');
    log('藍牙中斷');
    if(running) setTimeout(tryReconnect,1500);
  }
  async function tryReconnect(){
    if(!running||!device)return;
    try{ server=await device.gatt.connect();
      const svc=await server.getPrimaryService(uuid(SERVICE));
      writeChar=await svc.getCharacteristic(uuid(WRITE_CH));
      setStatus('<b>接收中</b>',true); log('重連成功');
    }catch(e){ setTimeout(tryReconnect,2000); }
  }

  // ---- 輪詢中繼站 ----
  async function poll(){
    if(!cfg.relay||!cfg.secret)return;
    try{
      const r=await fetch(`${cfg.relay}/get?k=${encodeURIComponent(cfg.secret)}`,{cache:'no-store'});
      if(r.status===403){setStatus('密語不符，已停止',false);stopReceiving();return;}
      const s=await r.json();

      // 逾時保護：中繼站太久沒更新 → 歸零
      if(s.ts && Date.now()-s.ts>TIMEOUT_MS){ estimTarget=0; if(estim>0)stepEstim();
        if(vibe>0){vibe=0;showNums();await pushState();} return; }

      if(s.stop){ await hardStop('收到停止'); return; }

      // 震動：即時
      const nv=clamp(s.vibe);
      if(nv!==vibe){ vibe=nv; showNums(); await pushState(); }

      // 電流：受上限 + 解鎖 + 爬升限速三重把關
      let ne=clamp(s.estim);
      if(!cfg.estimOK) ne=0;
      ne=Math.min(ne,cfg.cap);
      if(ne!==estimTarget){ estimTarget=ne; stepEstim(); }
    }catch(e){ /* 網路抖動，下次再問 */ }
  }
  function clamp(x){let n=parseInt(x,10);if(isNaN(n))n=0;return Math.max(0,Math.min(100,n));}

  // ---- 開始 / 停止 ----
  async function startReceiving(){
    cfg={relay:el.relay.value.trim().replace(/\/$/,''), secret:el.secret.value.trim(),
      cap:Math.max(1,Math.min(100,+el.cap.value||30)),
      rate:Math.max(1,Math.min(100,+el.rate.value||10)),
      estimOK:el.estimLock.checked};
    if(!cfg.relay||!cfg.secret){setStatus('請先填中繼站網址和密語');return;}
    save();
    try{
      const ok=await connectBLE(); if(!ok)return;
      running=true;
      el.start.disabled=true; el.stop.disabled=false;
      setStatus('<b>接收中</b>',true);
      clearInterval(pollTimer); pollTimer=setInterval(poll,POLL_MS);
    }catch(e){ setStatus('連線失敗：'+e.message); log(e.message); }
  }
  async function stopReceiving(){
    running=false; clearInterval(pollTimer);
    await hardStop('停止接收');
    await writeRaw(END);
    if(device&&device.gatt.connected)device.gatt.disconnect();
    el.start.disabled=false; el.stop.disabled=true;
    setStatus('已停止');
  }

  el.start.onclick=startReceiving;
  el.stop.onclick=stopReceiving;
  el.hardstop.onclick=()=>hardStop('手動');
  el.estimLock.onchange=()=>{cfg.estimOK=el.estimLock.checked;
    if(!cfg.estimOK){estimTarget=0;stepEstim();} save();
    log('微電流'+(cfg.estimOK?'已允許':'已關閉'));};

  // 防止 iPad 自動休眠中斷（盡力而為）
  let wakeLock=null;
  async function keepAwake(){ try{ if('wakeLock' in navigator)
    wakeLock=await navigator.wakeLock.request('screen'); }catch(_){}}
  document.addEventListener('visibilitychange',async()=>{
    if(document.hidden){ log('頁面切到背景，連線可能被系統暫停'); }
    else if(running){ await keepAwake(); }
  });

  load();
  setStatus('填好設定後按「開始接收」');
})();
</script>
</body>
</html>
